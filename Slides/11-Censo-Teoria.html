## 🎯 Objetivos
&lt;br&gt;&lt;br&gt;

.font80[
Ao final desta aula espera-se que o discente seja capaz de...

* Entender a relação entre Censo Florestal (ou Inventário 100%) e o Manejo Florestal Sustentável para fins Madeireiro;
* Conhecer as principais legislações (Leis, Resoluções, INs) que orientam o MFS e IF-100%;
* Compreender os conceitos chaves (legais) para o licenciamento ambiental do MFS para fins madeireiros;
* Compreender as principais etapas do MFS para fins madeireiros;
* Compreender as principais etapas para realização do censo florestal; 
* Conhecer os instrumentos, materiais e produtos do IF-100%; e
* Aprender a realizar análise técnica de IF-100% no âmbito MFS para fins Madeireiro.
]

## Manejo Florestal Sustentável - MFS: Definição

.shadow1b[
.font80[
.center[
### [Lei nº 12.651, de 25 de maio de 2012 - Novo Código Florestal](https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm)
]
&lt;br&gt;

**Manejo Florestal Sustentável** (.orange[inciso VII do Art. 3º]):
&lt;br&gt;&lt;br&gt;

_.orange[**Manejo Florestal Sustentável**]: **administração da vegetação natural** para a obtenção de **benefícios econômicos, sociais e ambientais**, respeitando-se os mecanismos de sustentação do ecossistema objeto do manejo e considerando-se, cumulativa ou alternativamente, a **utilização de múltiplas espécies madeireiras ou não**, **de múltiplos produtos e subprodutos da flora**, bem como a utilização de outros **bens e serviços**._
]
]

## Manejo Florestal Sustentável - MFS

.shadow1b[
.center[
### .blue[Principais Legislações - MFS para fins madeireiros]
]
&lt;br&gt;
.font70[

- **Esfera Federal:**

1 - [Constituição da República Federativa do Brasil de 1988](http://www.planalto.gov.br/ccivil_03/Constituicao/Constituicao.htm) (Art. 225º do Capítulo VI - Do Meio Ambiente)

2 - [Lei nº 6.938 de 31 de agosto de 1981](https://www.planalto.gov.br/ccivil_03/leis/l6938.htm) (Política Nacional do Meio Ambiente - PNMA)

3 - [Decreto nº 5.975 de 30 de novembro 2006](http://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/decreto/d5975.htm) (Defini fundamentos técnicos gerais do PMFS, transporte de produtos e subprodutos florestais)

4 - [Lei nº 11.284 de 02 de março de 2006](https://www.planalto.gov.br/ccivil_03/_Ato2004-2006/2006/Lei/L11284.htm) (Lei de gestão de florestas públicas para a produção sustentável)

5 - [Norma de Execução/IBAMA 01 de 24 de 04 de 2007](https://www.legisweb.com.br/legislacao/?id=91545)  (Diretrizes Técnicas para Elaboração dos PMFS)

6 - [Lei nº 12.651 de 25 de maio de 2012](https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm) (Novo Código Florestal)

7 - [Resolução nº 406 de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578) (Parâmetros técnicos para elaboração, avaliação e execução de PMFS fins madeireiros)

8 - [Portaria MMA nº 443 de 17 de dezembro de 2014](https://www.icmbio.gov.br/cepsul/images/stories/legislacao/Portaria/2014/p_mma_443_2014_lista_esp%C3%A9cies_amea%C3%A7adas_extin%C3%A7%C3%A3o.pdf) (Lista as espécies da flora brasileira ameaçadas de extinção)

9 - [Portaria MMA nº 148 de 07 de junho de 2022](https://www.icmbio.gov.br/cepsul/images/stories/legislacao/Portaria/2020/P_mma_148_2022_altera_anexos_P_mma_443_444_445_2014_atualiza_especies_ameacadas_extincao.pdf) (Altera anexos da Portaria MMA nº 443, de 17 de dezembro de 2014)

10 - [Instrução Normativa nº 01 de 12 de fevereiro de 2015 – MMA](https://www.ibama.gov.br/sophia/cnia/legislacao/MMA/IN0001-12022015.pdf)  (Regulamenta o manejo das espécies vulneráveis - VU)

11 - [Instrução Normativa/IBAMA nº 28 de 10 de dezembro de 2024 – MMA](https://www.ibama.gov.br/component/legislacao/?view=legislacao&amp;legislacao=139446)  (MFS espécies listadas na CITES dos gêneros Handroanthus, Tabebuia, Dipteryx e Cedrela)
]
]

## Documentos técnicos: PMFS e POA

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

_.orange[**Plano Manejo Florestal Sustentável - PMFS** (inciso X do Art. 2º)]: documento técnico básico que apresenta as diretrizes e procedimentos para administração da floresta de acordo com os princípios do manejo florestal sustentável._

&lt;br&gt;

_.orange[**Plano Operacional Anual - POA** (inciso XI do Art. 2º)]: documento a ser apresentado ao órgão ambiental competente, contendo as informações definidas em suas diretrizes técnicas, com a especificação das atividades a serem realizadas no período de 12 meses._
]
]

## Área de Manejo Florestal - AMF

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

_.orange[**Área de Manejo Florestal** (inciso I do Art. 2º)]: **conjunto de Unidades de Manejo Florestal - UMF** que compõem o PMFS, contíguas ou não, localizadas em um único Estado._

&lt;br&gt;

_.orange[**Unidade de Manejo Florestal** (inciso XII do Art. 2º)]: Área do imóvel rural a ser utilizada no manejo florestal._
]
]

.shadow1b[
.font80[
.center[
### [Instrução Normativa/SEMAS nº 05, de 10 de Setembro de 2015](https://www.semas.pa.gov.br/legislacao/files/pdf/184.pdf)
]

&lt;br&gt;

_.orange[**Unidade de Manejo Florestal** (inciso XXIV do Art. 2º)]: área do imóvel rural ou sob contrato de concessão que se constitui parte integrante da Área de Manejo Florestal – AMF._

]
]

name: aeef
## Área de Efetiva Exploração Florestal

.shadow1b[
.font80[
.center[
### [Instrução Normativa/SEMAS nº 05, de 10 de Setembro de 2015](https://www.semas.pa.gov.br/legislacao/files/pdf/184.pdf)
]

&lt;br&gt;

_.orange[**Área de Efetiva Exploração Florestal - AEE** (inciso I do Art. 2º)]: **área efetivamente explorada na .blue[Unidade de Trabalho - UT]**, computando-se as áreas com árvores sem porte comercial para exploração e excluindo-se:_

&lt;br&gt;

a) Áreas de preservação permanente;

b) Áreas inacessíveis;

c) Áreas de infraestrutura;

d) Áreas antropizadas (em regime ou não de pousio); e

e) Áreas indisponíveis legalmente.

]
]

---
name: aemf
## Área de Efetivo Manejo Florestal

.shadow1b[
.font80[
.center[
### [Instrução Normativa/SEMAS nº 05, de 10 de Setembro de 2015](https://www.semas.pa.gov.br/legislacao/files/pdf/184.pdf)
]

&lt;br&gt;

_.orange[**Área de Efetivo Manejo** (inciso II do Art. 2º)]: **área da .blue[Unidade de Manejo Florestal - UMF] com potencial presente ou futuro para exploração florestal**, excluídas:_

&lt;br&gt;

a) Áreas de preservação permanente;

b) Áreas inacessíveis;

c) Áreas de infraestrutura;

d) Áreas antropizadas (em regime ou não de pousio); e

e) Áreas indisponíveis legalmente.

]
]

.shadow1b[
.font80[
.center[

]

_.orange[**Autorização para Exploração - AUTEX** (inciso II do Art. 2º)]: documento expedido pelo órgão competente que autoriza o início da exploração da Unidade de Produção Anual-UPA e especifica o volume máximo por espécie permitido para exploração._
]
]

.shadow1b[

]

&lt;br&gt;

_.orange[**Autorização para Exploração Florestal - AUTEF** (inciso VI do Art. 2º)]: documento expedido pela Secretaria de Estado de Meio Ambiente e Sustentabilidade do Pará - SEMAS/PA, que autoriza o início da exploração da Unidade de Produção Anual - UPA, do ano a que se refere, e especifica o volume máximo por espécie e volume total permitido para exploração, com a validade para uma safra._
]
]

name: cc
## Ciclo de Corte

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

_.orange[**Ciclo de Corte** (inciso III do Art. 2º)]: **período de tempo**, em anos, **entre sucessivas colheitas** de produtos florestais madeireiros ou não-madeireiros numa mesma área._

- .blue[**Ideia**]: Período de tempo necessário para que a floresta se recupere da exploração florestal, e possa ser novamente explorada.
- .blue[**Quantos anos?**]: (denpende do método de extração de madeira!)

| **Arraste de Tora** |               **Ciclo de corte**               |
|:-------------------:|:----------------------------------------------:|
|    Com maquinário   | **_Mínimo_**: 25 anos&lt;br&gt;**_Máximo_**: 35 anos |
|    Sem maquinário   |              **_Mínimo_**: 10 anos             |

]
]

name: ic
## Intensidade de Corte

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

_.orange[**Intensidade de Corte** (inciso VI do Art. 2º)]: volume comercial das árvores derrubadas para aproveitamento, estimado por meio de equações volumétricas previstas no PMFS e com base nos dados do IF-100%, expresso em metros cúbicos por unidade de área (m³/ha) de efetiva exploração florestal, calculada para cada Unidade de Trabalho (UT)._

&lt;br&gt;

_.orange[**Intensidades Máximas de Corte** (inciso IV do Art. 4º)]: _

.blue[Qual máximo de metros cúbicos (de madeira) posso explorar por hectare?]

&lt;br&gt;

| **Arraste de Tora** |   **Intensidade Máxima &lt;br&gt; de corte**  |   **Ciclo de corte inicial**|
|:-------------------:|:---------------------------------------:|:---------------------------:|
|    Com maquinário   |           30 m³/ha                      |               35 anos       |
|    Sem maquinário   |           10 m³/ha                      |               10 anos       |

]
]

name: rel
## Relação entre EPA, CC e IC

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

_.orange[**Estimativa da Produtividade Anual - EPA** (inciso I do Art. 4º)]: a EPA da floresta manejada para o grupo de espécies comerciais, quando não houver estudos para a área, será de .blue[**0,86 m³/ha/ano**] para PMFS com uso de máquinas para arraste de toras._

- Em PMFS com arraste mecanizado, em geral, usa-se a EPA (.blue[**0,86 m³/ha/ano**]) para definir o Ciclo de Corte (CC) adequado em função da Intensidade de Corte (IC), ou vice-versa. Por exemplo:

**a) Qual ciclo de corte para um PMFS que prevê uma intensidade de exploração de 30 m³/ha?**

**b) Qual intensidade de exploração máxima para um PMFS que prevê um ciclo de corte de 30 anos?**

]
]


.pull-left-4[
**Questão a**
$$
\small
`\begin{align*}
    \left.\begin{aligned}
    0,86~m³/ha &amp; \longleftrightarrow 1~ano \\
    30~m³/ha &amp; \longleftrightarrow X~anos
    \end{aligned}\right\}   X = 34,88~anos ∼ \color{blue}{35~anos}
\end{align*}`
$$
]

--

.pull-right-4[
**Questão b**
$$
\small
`\begin{align*}
    \left.\begin{aligned}
    0,86~m³/ha &amp; \longleftrightarrow 1~ano \\
    X~m³/ha &amp; \longleftrightarrow 30~anos
    \end{aligned}\right\}   X = 25,8~m³/ha ∼ \color{blue}{25~m³/ha}
\end{align*}`
$$
]

## Cálculo do Volume da Árvore em Pé

.shadow1b[
.font80[
.center[
### [Instrução Normativa Nº 05, de 10 de Setembro de 2015](chrome-extension://efaidnbmnnnibpcajpcglclefindmkaj/https://www.semas.pa.gov.br/legislacao/files/pdf/184.pdf)
]

&lt;br&gt;

- **Volume da Árvore em Pé (1ª UPA)**

_.orange[**Art. 24º**]: Para o cálculo do volume de árvores em pé, será aceito a utilização do **fator de forma igual a 0,7**, apenas, quando se tratar da primeira UPA, para corrigir o volume do cilindro tendo como o diâmetro da base o DAP._

&lt;br&gt;

.center[<span>&lt;i class="fas  fa-exclamation-triangle faa-flash animated " style=" color:red;"&gt;&lt;/i&gt;</span> .blue[**Fator de Forma 0,7 admitido apenas para 1ª UPA!**]]


`$$v_i = \dfrac{\pi d^2}{40.000}. h. 0,7$$`

_.orange[**Art. 24º, Parágrafo único**]: A partir do segundo POA somente será aceito pela SEMAS/PA o volume de árvores em pé, calculado mediante equação de volume desenvolvida especificamente para a UMF._
]
]

.shadow1b[
.font80[
.center[
### [Resolução nº 406, de 02 de fevereiro de 2009](http://conama.mma.gov.br/?option=com_sisconama&amp;task=arquivo.download&amp;id=578)
]

&lt;br&gt;

- **Critérios de Manutenção de Árvores (espécies exploradas)?**

_.orange[**Inciso IV do art. 4º, alínea “c”**]: Manter pelo menos 10% do número de árvores por espécie, na área de efetiva exploração da UPA, que atendam aos critérios de seleção para corte indicados no PMFS, respeitados o limite mínimo de manutenção de três árvores por espécie por 100 ha (cem hectares), em cada UT._

&lt;br&gt;

_.orange[**Inciso IV do art. 4º, alínea “d”**]: Manter todas as árvores das espécies, cuja abundância de indivíduos com DAP superior ao DMC seja igual ou inferior a três árvores por 100 ha de área de efetiva exploração da UPA, em cada UT._

&lt;br&gt;

.center[<span>&lt;i class="fas  fa-exclamation-triangle faa-flash animated " style=" color:red;"&gt;&lt;/i&gt;</span> .blue[**Manter todas as árvores das espécies com menos de 3 árvores por 100 ha!**]]

]
]

## Etapas Precedentes ao Censo Florestal (IF-100%)

.shadow1b[
### Antes do IF-100% deve-se:
&lt;br&gt;
.font80[
👉 **1 - Elaborar o mapa de localização (UPA e UTs).**
- .blue[**Objetivo**]: Auxiliar em campo na delimitação da UT (Azimute da linha base da UT).

&lt;br&gt;

👉 **2 - Delimitar (em campo) as Unidades de Trabalho - UT.**
- .blue[**Objetivo**]: Definir os limites físicos da UT.
- .blue[**Tamanho**]: É comum (.red[Não é uma regra!]) a delimitação de UTs com área de 100ha (1000m x 1000m). (Vai depender do tamanho da área!)
- .blue[**Recomendação**]: Sempre que possível, delimitar UTs com limites regulares (retangulares ou quadradas).
]
]

name: estr
## Unidade de Trabalho: Estrutura

.pull-left-2[
&lt;img src="fig/class8/UT.jpeg" width="100%" style="display: block; margin: auto;" /&gt;
.center[.font80[**Fonte:** [Reis et al., 2013.](http://www.ift.org.br/publicacoes/producao-tecnica/manuais-e-cartilhas/)]]

]

.pull-right-1[
&lt;br&gt;
.center[**Recomendações** (Reis et al., 2013)]
.font80[
- **Linha Base**: Sempre que possível, no .blue[sentido norte-sul].
- **Trilhas de orientação**: Sempre que possível, no .blue[sentido leste-oeste].
- **Distancia entre trilhas**: As trilhas de orientação são abertas a cada 50m, e perpendicular à linha base.

&lt;br&gt;

**Por que priorizar esses sentidos?**

- Facilita a construção de estradas secundárias no sentido leste-oeste (melhor ventilação, exposição ao sol e manutenção).
]
]

---

## Unidade de Trabalho: Estrutura

.shadow1b[
### Fatores que afetam a posição e forma das UTs (Reis et al., 2013)
&lt;br&gt;
.font80[
👉 **1 - Condições do terreno**:
- Presença de grotas (baixadas), igarapés, morros.

👉 **2 - Estradas pré-existentes (e futuras)**:
- Posicionar as UTs de modo a facilitar o acesso por estradas pré-existentes (ou futuras). 

👉 **3 - Escoamento da produção fluvial?**:
- Posicionar as UTs de modo a facilitar o escoamento por rio.
]
]

---
name: mat
## Unidade de Trabalho: Equipe, materiais e equipamentos

.shadow1b[
### Equipe, materiais e equipamentos (Reis et al., 2013)
&lt;br&gt;
.font80[
👉 **1 - Equipe**: 4 pessoas (1 coordenador e 3 trabalhadores)
- **Coordenador**: Usar a bússola e definir os ângulos de orientação.
- **Trabalhadores**: Abrir as trilhas com facão, cortar e colocar piquetes (com indicação da distância) e medir distâncias entre piquetes.

&lt;br&gt;

👉 **2 - Materiais e Equipamentos**:
- **Material**: facão, lápis estaca azul, papel milimetrado, prancheta e lápis.
- **Equipamento**: bússola, trena/cabo de agrimensor (30/50 metros), cantil, kit de primeiros socorros. 
- **EPIs**: capacete, calças e camisas de mangas compridas, bota de bico de aço, perneira e colete de identificação.
]
]

name: delim
## Unidade de Trabalho: Delimitação

.shadow1b[
### Delimitação da UT: 3 abordagens (Reis et al., 2013)
]

.pull-left-2[
&lt;img src="fig/class8/UT-del1.jpeg" width="70%" style="display: block; margin: auto;" /&gt;
.center[.font80[**Fonte:** [Reis et al., 2013.](http://www.ift.org.br/publicacoes/producao-tecnica/manuais-e-cartilhas/)]]

]

.pull-right-1[
&lt;br&gt;
.center[**Abordagem 1** (Reis et al., 2013)]
.font80[

- **Esquadrejamento da UT**: A ideia é fechar o quadrado (esquadrejamento) da UT. Na sequência, abre-se as trilhas de orientação internas.
]
]

## Unidade de Trabalho: Delimitação

.shadow1b[
### Delimitação da UT: 3 abordagens (Reis et al., 2013)
]

.pull-left-2[
&lt;img src="fig/class8/UT-del2.jpeg" width="70%" style="display: block; margin: auto;" /&gt;
.center[.font80[**Fonte:** [Reis et al., 2013.](http://www.ift.org.br/publicacoes/producao-tecnica/manuais-e-cartilhas/)]]

]

.pull-right-1[
&lt;br&gt;
.center[**Abordagem 2** (Reis et al., 2013)]
.font80[

- **Abrir dois lados (ângulo de 90º)**: A ideia é abrir dois lados (a linha base e uma trilha de orientação), formando um ângulo de 90º. Na sequência, prosseguir a abertura das trilhas internas (zigue-zague), e ao mesmo tempo fechando os lados da UT.
]
]

## Unidade de Trabalho: Delimitação

.shadow1b[
### Delimitação da UT: 3 abordagens (Reis et al., 2013)
]

.pull-left-2[
&lt;img src="fig/class8/UT-del3.jpeg" width="70%" style="display: block; margin: auto;" /&gt;
.center[.font80[**Fonte:** [Reis et al., 2013.](http://www.ift.org.br/publicacoes/producao-tecnica/manuais-e-cartilhas/)]]

]

.pull-right-1[
&lt;br&gt;
.center[**Abordagem 3** (Reis et al., 2013)]
.font80[

- **UTs irregulares**:

**Problema**: Não é possível (ou muito difícil) esquadrejar todo o perímetro da UT. Portanto, a UT não terá uma forma regular (quadradas ou retangulares).

**Ideia**: Caminhar até o início da área que não poderá ser manejada (encostas de morros, APPs). Esse ponto será limite final da trilha de orientação.
]
]

---

## Unidade de Trabalho: Delimitação

.shadow1b[
### Delimitação da UT: Passo a Passo (Reis et al., 2013)
]

.pull-left-4[

]

.pull-right-4[
&lt;br&gt;
.center[**Passo 1** (Reis et al., 2013)]
.font80[
- Deslocar-se até o marco zero da UT (ponto inicial);
- Retirar um piquete e fixar no marco inicial; e
- Apoiar a bússula no piquete e procurar o azimute definido no macroplanejamento.

&lt;br&gt;

**Obs.:** azimute indica a direção de abertura da linha base.
]
]

## Constituição Federal e Meio Ambiente

.shadow1b[
.font80[
.center[
### [Constituição da República Federativa do Brasil de 1988](http://www.planalto.gov.br/ccivil_03/Constituicao/Constituicao.htm)
]
&lt;br&gt;

**Constituição Federal e Meio Ambiente** (.orange[Art. 225º do Capítulo VI - Do Meio Ambiente]):
&lt;br&gt;&lt;br&gt;

_.orange[**Art. 225**]. **Todos têm direito ao meio ambiente ecologicamente equilibrado**, bem de uso comum do povo e essencial à sadia qualidade de vida, impondo-se ao Poder Público e à coletividade o dever de **defendê-lo e preservá- lo para as presentes e futuras gerações**._

- § 1º Para assegurar a efetividade desse direito, incumbe ao Poder Público:

VII – proteger a fauna e a flora, vedadas, na forma da lei, as práticas que coloquem em risco sua função ecológica, provoquem a extinção de espécies ou submetam os animais a crueldade.

]
]

]

- O Novo código florestal admite o manejo sustentável da vegetação da RL:

**Seção II - Do Regime de Proteção da Reserva Legal**

_.orange[**§ 1º do Art. 17**]: **Admite-se a exploração econômica da Reserva Legal** mediante **manejo sustentável**, previamente aprovado pelo órgão competente do Sisnama, de acordo com as modalidades previstas no art. 20._

_.orange[**Art. 20**]: No manejo sustentável da vegetação florestal da Reserva Legal, serão adotadas práticas de exploração seletiva nas modalidades de **manejo sustentável sem propósito comercial** para consumo na propriedade e **manejo sustentável para exploração florestal com propósito comercial**._

_.orange[**Art. 21**]: É livre a coleta de **produtos florestais não madeireiros**, tais como frutos, cipós, folhas e sementes, devendo-se observar:_

I - os períodos de coleta e volumes fixados em regulamentos específicos, quando houver;

II - a época de maturação dos frutos e sementes; e

III - técnicas que não coloquem em risco a sobrevivência de indivíduos e da espécie coletada no caso de coleta de flores, folhas, cascas, óleos, resinas, cipós, bulbos, bambus e raízes.

- O Novo código florestal admite o manejo sustentável da vegetação da RL:

**Seção II - Do Regime de Proteção da Reserva Legal**

_.orange[**Art. 22**]: O **manejo florestal sustentável da vegetação da Reserva Legal com propósito comercial depende de autorização do órgão competente** e deverá atender as seguintes diretrizes e orientações:_

I - não descaracterizar a cobertura vegetal e não prejudicar a conservação da vegetação nativa da área;

II - assegurar a manutenção da diversidade das espécies; e

III - conduzir o manejo de espécies exóticas com a adoção de medidas que favoreçam a regeneração de espécies nativas.

]

## Área de Preservação Permanente - APP

.shadow1b[
.font80[
.center[
### [Lei nº 12.651, de 25 de maio de 2012 - Novo Código Florestal](https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm)
]

&lt;br&gt;

_.orange[**Área de Preservação Permanente** (inciso II do Art. 3º)]: **área protegida**, **coberta ou não por vegetação nativa**, com a **função ambiental de preservar**:_

a) Os recursos hídricos;

b) A paisagem;

c) A estabilidade geológica;

d) A biodiversidade; 

e) Facilitar o fluxo gênico de fauna e flora;

f) Proteger o solo; e 

g) Assegurar o bem-estar das populações humanas.


&lt;br&gt;

<span>&lt;i class="fas  fa-exclamation-triangle faa-flash animated " style=" color:red;"&gt;&lt;/i&gt;</span> **Área Protegida! Não é permitida a exploração econômica direta!**

<span>&lt;i class="fas  fa-exclamation-triangle faa-flash animated " style=" color:red;"&gt;&lt;/i&gt;</span> **No MFS para fins madeireiros não pode explorar árvores em APP!**
]
]

## Área de Preservação Permanente - APP

.shadow1b[
.font70[
.center[
### [Lei nº 12.651, de 25 de maio de 2012 - Novo Código Florestal](https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm)
]

&lt;br&gt;

**Seção I - Da Delimitação das Áreas de Preservação Permanente**

_.orange[**Art. 4**]: Considera-se Área de Preservação Permanente, em zonas rurais ou urbanas:_

----------------------------------------------------------------------
_.blue[**I**] - **as faixas marginais de qualquer curso d’água natural perene e intermitente**, excluídos os efêmeros, desde a borda da calha do leito regular, em largura mínima de:_

a) 30 (trinta) metros, para os cursos d’água de menos de 10 (dez) metros de largura;

b) 50 (cinquenta) metros, para os cursos d’água que tenham de 10 (dez) a 50 (cinquenta) metros de largura;

c) 100 (cem) metros, para os cursos d’água que tenham de 50 (cinquenta) a 200 (duzentos) metros de largura;

d) 200 (duzentos) metros, para os cursos d’água que tenham de 200 (duzentos) a 600 (seiscentos) metros de largura; e

e) 500 (quinhentos) metros, para os cursos d’água que tenham largura superior a 600 (seiscentos) metros.

----------------------------------------------------------------------
_.blue[**II**] - as **áreas no entorno dos lagos e lagoas naturais**, em faixa com largura mínima de:_

a) 100 (cem) metros, em zonas rurais, exceto para o corpo d’água com até 20 (vinte) hectares de superfície, cuja faixa marginal será de 50 (cinquenta) metros; e

b) 30 (trinta) metros, em zonas urbanas.

]
]
